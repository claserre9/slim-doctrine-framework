; Xdebug settings. The ${...} placeholders are resolved by PHP at startup from the
; container environment (docker-compose.yml / .env), not at image build time.
; The extension itself is loaded by docker-php-ext-xdebug.ini.
xdebug.mode=${XDEBUG_MODE:-off}
xdebug.start_with_request=${XDEBUG_START_WITH_REQUEST:-trigger}
xdebug.client_host=${XDEBUG_CLIENT_HOST:-host.docker.internal}
xdebug.client_port=${XDEBUG_CLIENT_PORT:-9003}
xdebug.log_level=${XDEBUG_LOG_LEVEL:-0}
xdebug.discover_client_host=${XDEBUG_DISCOVER_CLIENT_HOST:-0}
